<!DOCTYPE html>
<html>
	<head>
		@include '../layout/head.html'
	</head>
	<body>
		@include '../layout/header.html'

		<div class="content">
			@include '../layout/repo_menu.html'

			<h1>%project_new</h1>

			<form method="post" action="/@repo.user_name/@repo.name/projects" class="project-form">
				<div class="field">
					<input type="text" name="name" placeholder="%project_name_placeholder" required>
				</div>
				<div class="field">
					<textarea name="description" placeholder="%project_description_placeholder" rows="4"></textarea>
				</div>
				<div class="field"><label>Label filter <select name="label_id"><option value="0">Any label</option>
					@for label in labels
						<option value="@label.id">@label.name</option>
					@end
				</select></label></div>
				<div class="field"><label>Milestone filter <select name="milestone_id"><option value="0">Any milestone</option>
					@for milestone in milestones
						<option value="@milestone.id">@milestone.title</option>
					@end
				</select></label></div>
				<div class="field"><label>Iteration filter <select name="iteration_id"><option value="0">Any iteration</option>
					@for iteration in iterations
						<option value="@iteration.id">@iteration.title</option>
					@end
				</select></label></div>
				<div class="field"><label>Assignee filter <select name="assignee_id"><option value="0">Anyone</option>
					@for member in members
						<option value="@member.id">@member.username</option>
					@end
				</select></label></div>
				<button type="submit" class="settings-form__submit">%project_create</button>
			</form>
		</div>

		@include '../layout/footer.html'
	</body>
</html>
